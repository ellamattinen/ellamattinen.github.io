<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Research - Ella Mattinen</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrapper">
    <header class="header-content">
      <h1>Ella Mattinen</h1>
      <p class="institution">Tampere University</p>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="cv.html" target="_blank">CV</a>
        <a href="research.html" class="active">Research</a>
      </nav>
    </header>


    <div class="cv-content">
      <section class="cv-section">
          <p> You can find my CV <a href="CV.pdf" target="_blank">here</a>.
          </p>
          <embed src="CV.pdf" type="application/pdf" width="100%" height="800px" />
        </div>

      </section>


    </div>
  </main>
  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const links = document.querySelectorAll(".nav-links a");
    const current = window.location.pathname.split("/").pop();

    // Reset and mark the current link as active
    links.forEach(link => {
      const href = link.getAttribute("href");
      if (href === current) {
        link.classList.add("active");
      } else {
        link.classList.remove("active");
      }
    });

    // Optional: flip back animation before navigating
    links.forEach(link => {
      link.addEventListener("click", (e) => {
        const href = link.getAttribute("href");

        // Flip all back first
        links.forEach(l => l.classList.remove("active"));

        // Add a brief delay for visual flip effect before page loads
        if (!href.endsWith(".pdf")) { // don’t delay CV
          e.preventDefault();
          setTimeout(() => {
            window.location.href = href;
          }, 250);
        }
      });
    });
  });
</script>

</body>
</html>
